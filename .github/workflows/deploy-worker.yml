name: Deploy notification worker

on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/deploy-worker.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: npx --yes wrangler@4.149.0
      WRANGLER_SEND_METRICS: 'false'
      KV_TITLE: verbeapp-push-subscribers
    steps:
      - name: Skip until Cloudflare is configured
        id: configured
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets are not set; see docs/notifications.md." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.configured.outputs.ready == 'true'
        uses: actions/checkout@v7
      - if: steps.configured.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.configured.outputs.ready == 'true'
        run: npm ci
      - name: Find or create the KV namespace
        if: steps.configured.outputs.ready == 'true'
        working-directory: worker
        run: |
          id=$($WRANGLER kv namespace list | jq -r --arg t "$KV_TITLE" '.[] | select(.title == $t) | .id')
          if [ -z "$id" ]; then
            $WRANGLER kv namespace create "$KV_TITLE"
            id=$($WRANGLER kv namespace list | jq -r --arg t "$KV_TITLE" '.[] | select(.title == $t) | .id')
          fi
          sed -i "s/KV_NAMESPACE_ID/$id/" wrangler.jsonc
      - name: Deploy
        if: steps.configured.outputs.ready == 'true'
        working-directory: worker
        run: $WRANGLER deploy | tee deploy.log
      - name: Create VAPID keys once
        if: steps.configured.outputs.ready == 'true'
        working-directory: worker
        run: |
          if $WRANGLER secret list | jq -e '.[] | select(.name == "VAPID_PRIVATE_KEY")' > /dev/null; then
            echo "VAPID keys already exist."
          else
            keys=$(npx tsx ../scripts/vapid-keys.ts)
            echo "::add-mask::$(echo "$keys" | jq -r .privateKey)"
            echo "$keys" | jq -r .privateKey | $WRANGLER secret put VAPID_PRIVATE_KEY
            echo "$keys" | jq -r .publicKey | $WRANGLER secret put VAPID_PUBLIC_KEY
          fi
      - name: Report the worker URL
        if: steps.configured.outputs.ready == 'true'
        working-directory: worker
        run: |
          url=$(grep -o 'https://[a-z0-9.-]*workers.dev' deploy.log | head -1)
          echo "Worker URL: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "Set the repository variable PUSH_API_URL to this URL." >> "$GITHUB_STEP_SUMMARY"
          curl -fsS "$url/vapid-public-key"
