name: Temporary source probe
on: push
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -u
          for id in 7213 57628 57634 16287 3600 2489; do
            curl -sSL -m 60 -o $id.txt "https://www.gutenberg.org/cache/epub/$id/pg$id.txt" || true
            echo "== $id: $(head -c 400 $id.txt | tr '\r\n' '  ' | grep -o 'Title:[^A]*' | head -1)"
          done
          for p in "particularly hard" "agree to attend" "Acceptance of what has happened" "tormented with the opinions" "opinion we have of them" "something to be enthusiastic" "saying yes too" "first step to overcoming"; do
            echo "### $p"
            grep -n -i -B3 -A3 "$p" *.txt | head -30
          done
