name: Verify quotes against sources

on:
  push:
    branches: [main]
    paths: ['data/**', 'src/sources/**', 'scripts/**']
  pull_request:
    paths: ['data/**', 'src/sources/**', 'scripts/**']
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Every quote appears in its source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Keep the downloaded editions between runs, so verification does not
      # fail when Standard Ebooks or Project Gutenberg is briefly unreachable.
      # Only editions missing from the cache are downloaded.
      - uses: actions/cache@v6
        with:
          path: .cache/editions
          key: editions-${{ hashFiles('data/sources.json') }}
          restore-keys: editions-
      - run: npm run data:verify
